# TubeCapullo LOCAL pins catalog (`pins.*`) - inter-repo capullo coordinates + this app's own
# single-app deps. Everything else (toolchain, BOM-managed Compose, lifecycle, Hilt, ktor,
# coroutines, junit) comes from the shared `libs` catalog (build-conventions).
[versions]
# capullo-audio - immutable jitpack commit. Same pin as telecloud-radio, and deliberately the SAME
# commit as the local capullo-audio-src checkout (cd1e595): everything HANDOFF-bootstrap documents
# about SnapserverProcess/SnapcontrolPlugin/QueuePlaybackLoop behaviour was read at that commit, so
# any other pin makes the docs and the artifact diverge silently.
capulloAudio = "cd1e5959223e06b356034e6cf13e0ce1a783f37c"
# NOTE: no lib-snapcast-android pin here, on purpose. The native .so binaries arrive transitively
# via capullo-audio, which owns the pin. telecloud's pins.versions.toml documents what a direct pin
# cost them: a version mismatch let Gradle pick the lexically-higher hash and package a STALE .so
# (green build, dead control plane, invisible to CI).
# NewPipeExtractor - YouTube search/stream extraction. GPLv3, same licence as this app. Pinned to an
# upstream release tag (jitpack builds the tag). Expect to bump this regularly: YouTube rotates its
# player JS and extraction stays broken until upstream cuts a release; the network-gated extractor
# test is what tells you it happened. Same pin as telecloud-radio.
newpipeExtractor = "v0.26.5"
# Blocking HTTP client behind NewPipeExtractor's Downloader SPI (which is synchronous, so ktor's
# suspend client doesn't fit). Pinned explicitly so this code doesn't silently break when ktor
# bumps its OkHttp (mirrors telecloud's reasoning).
okhttp = "4.12.0"
# material-icons core/extended ship separately from the Compose BOM (last released 1.7.x line).
composeIcons = "1.7.8"
mockk = "1.14.6"
hiltNavigationCompose = "1.3.0"

[libraries]
# jitpack multi-module coords: capullo-audio-ui is ONLY at the nested group
# com.github.capullo-tech.capullo-audio, so the engine must use the SAME nested group (flat +
# nested = duplicate classes) - see telecloud's pins for the history.
capullo-audio = { module = "com.github.capullo-tech.capullo-audio:capullo-audio", version.ref = "capulloAudio" }
capullo-audio-ui = { module = "com.github.capullo-tech.capullo-audio:capullo-audio-ui", version.ref = "capulloAudio" }
# Versionless on purpose: the shared catalog's Compose BOM sets the version (CONTRIBUTING §2 -
# "Keep Compose artifacts versionless"). TC pins a newer alpha here; we have no reason to.
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "composeIcons" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }
newpipe-extractor = { module = "com.github.teamnewpipe:NewPipeExtractor", version.ref = "newpipeExtractor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }
