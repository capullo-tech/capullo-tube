name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      version_code:
        type: string
        default: ''
      version_name:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check spotless
        run: ./gradlew spotlessCheck --no-configuration-cache
      - name: Check lint
        run: ./gradlew :app:lintDebug
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi
      - name: Build APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          APK_VERSION_CODE: ${{ inputs.version_code }}
          APK_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$APK_VERSION_CODE" ] || [ -n "$APK_VERSION_NAME" ]; then
            test -n "$APK_VERSION_CODE" && test -n "$APK_VERSION_NAME"
            args+=("-PcapulloVersionCode=$APK_VERSION_CODE" "-PcapulloVersionName=$APK_VERSION_NAME")
          fi
          ./gradlew :app:assembleRelease "${args[@]}"
      - name: Upload build outputs (APK)
        uses: actions/upload-artifact@v4
        with:
          name: capullo-tube-${{ github.sha }}
          path: '**/build/outputs/apk-named/release/*.apk'
