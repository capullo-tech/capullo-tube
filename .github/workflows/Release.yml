name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Allocate publication identity
        run: python3 scripts/preview_release.py identity "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
  build:
    needs: identity
    uses: ./.github/workflows/Build.yml
    with:
      version_code: ${{ needs.identity.outputs.code }}
      version_name: ${{ needs.identity.outputs.name }}
    secrets: inherit
  release:
    needs: [identity, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: capullo-tube-${{ github.sha }}
          path: ./artifacts
      - name: Verify the APK is signed
        run: |
          set -eu
          apk=$(find ./artifacts -name "*.apk" | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest'
      - name: Publish immutable preview
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 scripts/preview_release.py publish \
            "$PUBLICATION_NUMBER" "$GITHUB_SHA" "$GITHUB_REPOSITORY" ./artifacts
