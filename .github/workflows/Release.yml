name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-release
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/Build.yml
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: capullo-tube-${{ github.sha }}
          path: ./artifacts
      - name: Verify the APK is signed
        run: |
          set -eu
          apk=$(find ./artifacts -name "*.apk" | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest'
      - name: Publish the rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apk_file=$(find ./artifacts -name "*.apk" | head -1)
          commit_hash=$(git rev-parse --short HEAD)
          tag="preview"

          gh release delete "$tag" --yes || true
          git tag -d "$tag" || true
          git push origin :refs/tags/preview || true

          gh release create "$tag" \
            --target "${{ github.ref_name }}" \
            --prerelease \
            --title "Preview ${{ github.run_number }} ($commit_hash)" \
            --notes "Preview build from $commit_hash. Signed with the preview key: it installs over previous previews."
          cp "$apk_file" "capullo-tube-preview.apk"
          gh release upload "$tag" "capullo-tube-preview.apk" --clobber
